<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Gym</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brain Gym">
<meta name="theme-color" content="#0E5A60">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#13262B; --muted:#4D6066; --line:#C6D1D0;
  --primary:#0E5A60; --on-primary:#FFFFFF; --anchor:#E23D28;
  --good:#1B6E42; --bad:#B3261E; --mark:#F4B63A; --on-mark:#13262B; --cell:#DAE3E2;
  --bar:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B1E; --surface:#18282C; --ink:#EAF1F0; --muted:#A3B5B8; --line:#33484C;
    --primary:#5CC5CC; --on-primary:#062427; --anchor:#FF5A43;
    --good:#5BD08E; --bad:#FF8A80; --mark:#F4B63A; --on-mark:#13262B; --cell:#263B3F;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B1E; --surface:#18282C; --ink:#EAF1F0; --muted:#A3B5B8; --line:#33484C;
  --primary:#5CC5CC; --on-primary:#062427; --anchor:#FF5A43;
  --good:#5BD08E; --bad:#FF8A80; --mark:#F4B63A; --on-mark:#13262B; --cell:#263B3F;
}
@media (min-width:700px){ :root{ --bar:16px; } }
html{ font-size:112.5%; height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
html[data-big="on"]{ font-size:135%; }
html[data-guide="off"]{ --bar:0px; }
*,*::before,*::after{ box-sizing:inherit; }
[hidden]{ display:none !important; }
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  line-height:1.45; -webkit-text-size-adjust:100%;
}
#anchor{ position:fixed; left:0; top:0; bottom:0; width:var(--bar); background:var(--anchor); z-index:5; }
#anchor.pulse{ animation:pulse 0.8s 3; }
@keyframes pulse{ 50%{ width:calc(var(--bar) * 3); } }
@media (prefers-reduced-motion: reduce){ #anchor.pulse{ animation:none; width:calc(var(--bar) * 2.5); } }
#app{ max-width:60rem; padding:1.1rem 1rem 3rem calc(var(--bar) + 1rem); }

h1{ font-size:1.7rem; line-height:1.15; margin:0; }
h2{ font-size:1.2rem; margin:0; }
p{ margin:0.6rem 0; max-width:36rem; }
.muted{ color:var(--muted); }

button{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
:focus-visible{ outline:3px solid var(--mark); outline-offset:3px; }
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:3.3rem; padding:0.6rem 1.4rem; border-radius:0.7rem;
  border:2px solid var(--primary); background:var(--primary); color:var(--on-primary);
  font-weight:700; font-size:1.1rem;
}
.btn.quiet{ background:transparent; color:var(--primary); }
.btn.small{ min-height:2.8rem; padding:0.4rem 1rem; font-size:1rem; }
.btn.big{ min-height:4.4rem; font-size:1.35rem; padding:0.8rem 1.8rem; margin-top:0.6rem; }
.btn[disabled]{ opacity:0.45; cursor:default; }
.btnrow{ display:flex; flex-wrap:wrap; gap:0.8rem; margin-top:1.4rem; }

.top{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.8rem; margin-bottom:1rem; }
.top nav{ display:flex; gap:0.6rem; }
.top .count{ font-weight:700; color:var(--muted); }
.greet{ font-size:1.3rem; margin:1.2rem 0 0.2rem; }

.week{ display:flex; align-items:center; flex-wrap:wrap; gap:0.4rem; margin:1.2rem 0 0; }
.week b{
  width:2.1rem; height:2.1rem; border-radius:50%; display:grid; place-items:center;
  border:2px solid var(--line); font-size:0.85rem; color:var(--muted);
}
.week b.on{ background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.week span{ margin-left:0.5rem; color:var(--muted); }

.area{ margin:1.9rem 0 0.5rem; font-size:1rem; color:var(--muted); }
.group{ background:var(--surface); border:1px solid var(--line); border-radius:0.8rem; overflow:hidden; }
.group > *:last-child{ border-bottom:0; }
.ex{
  display:grid; grid-template-columns:1fr auto; gap:0.1rem 1rem; align-items:center;
  width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line);
  padding:0.9rem 1rem; min-height:4.4rem;
}
.ex-name{ font-weight:700; font-size:1.15rem; }
.ex-what{ color:var(--muted); font-size:0.95rem; }
.ex-meta{ color:var(--muted); font-size:0.95rem; text-align:right; white-space:nowrap; }

.instr-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; }
.instr{ font-size:1.3rem; font-weight:700; line-height:1.3; margin:0.2rem 0 1rem; }
.listen{
  flex:none; min-height:2.8rem; padding:0.3rem 0.9rem; border-radius:0.7rem;
  border:2px solid var(--line); background:var(--surface); font-weight:700; font-size:0.95rem;
}
.stage{ margin-top:0.4rem; }
.stage.locked{ pointer-events:none; }
.cue{ font-weight:700; min-height:1.5em; margin:0.8rem 0; }
.task{ font-size:1.4rem; margin-bottom:0.8rem; }

.grid{ display:grid; gap:6px; }
.grid.sq{ width:min(100%, 17rem); }
.grid.wide .cell{ aspect-ratio:auto; height:100%; }
.stage{ -webkit-user-select:none; user-select:none; }
.cell{
  aspect-ratio:1; min-width:0; padding:0; border:0; border-radius:8px;
  background:var(--cell); color:var(--ink);
  display:grid; place-items:center; line-height:1; font-weight:700;
  font-size:clamp(1.15rem, 4.4vw, 1.75rem); position:relative;
}
div.cell{ cursor:default; }
.cell.on{ background:var(--primary); color:var(--on-primary); }
.cell.hit{ background:var(--mark); color:var(--on-mark); box-shadow:inset 0 0 0 3px var(--ink); }
.cell.missed{ background:transparent; outline:3px dashed var(--bad); outline-offset:-3px; }
.cell.extra{ background:var(--cell); }
.cell.extra::after{ content:"\2715"; color:var(--bad); font-size:1.3rem; }
.flash{ animation:flash 0.4s; }
@keyframes flash{ 0%,100%{ box-shadow:0 0 0 0 transparent; } 35%{ box-shadow:0 0 0 5px var(--bad); } }

.pair{ display:flex; flex-wrap:wrap; gap:1.4rem 3rem; align-items:flex-start; margin-bottom:1.2rem; }
.pair > div{ flex:1 1 13rem; max-width:17rem; }
.pair h3{ margin:0 0 0.5rem; font-size:1rem; color:var(--muted); }

.bigword{
  background:var(--surface); border:1px solid var(--line); border-radius:0.8rem;
  padding:1.6rem 1rem; text-align:center; font-weight:700; line-height:1.2;
  font-size:clamp(1.8rem, 7vw, 3.2rem); letter-spacing:0.02em; overflow-wrap:anywhere;
}
.opts{ display:grid; grid-template-columns:repeat(2, 1fr); gap:0.7rem; margin-top:1rem; }
.opts.col{ grid-template-columns:1fr; max-width:36rem; }
@media (max-width:420px){ .opts{ grid-template-columns:1fr; } }
.opt{
  min-height:3.8rem; padding:0.7rem 1rem; text-align:left; font-size:1.15rem; font-weight:700;
  background:var(--surface); border:2px solid var(--line); border-radius:0.7rem;
}
.opt.right{ border-color:var(--good); }
.opt.right::before{ content:"\2713\00a0\00a0"; color:var(--good); }
.opt.wrong{ border-color:var(--bad); }
.opt.wrong::before{ content:"\2715\00a0\00a0"; color:var(--bad); }
.opt.hint, .node.hint{ box-shadow:0 0 0 5px var(--mark); }
.scenario{ font-size:1.3rem; line-height:1.4; margin:0 0 0.4rem; }
.q{ font-weight:700; margin:1rem 0 0; }

.board{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:0.8rem; }
.lines{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.lines line{ stroke:var(--primary); stroke-width:3; vector-effect:non-scaling-stroke; }
.node{
  position:absolute; width:52px; height:52px; transform:translate(-50%,-50%); padding:0;
  border-radius:50%; border:2px solid var(--ink); background:var(--surface);
  font-weight:700; font-size:20px; line-height:1;
}
.node.done{ background:var(--primary); border-color:var(--primary); color:var(--on-primary); }

.flashbox{
  height:11rem; display:grid; place-items:center; background:var(--surface);
  border:4px solid var(--line); border-radius:0.8rem; font-size:5.5rem; line-height:1;
}
.flashbox[data-r="good"]{ border-color:var(--good); }
.flashbox[data-r="bad"]{ border-color:var(--bad); }
.ringed{ display:inline-grid; place-items:center; width:8.6rem; height:8.6rem; border:8px solid var(--ink); border-radius:50%; }
.prog{ height:6px; background:var(--line); border-radius:3px; margin-top:0.8rem; overflow:hidden; }
.prog i{ display:block; height:100%; width:0; background:var(--primary); }
.tap{ width:100%; min-height:6rem; font-size:1.6rem; }

.clock{ display:block; width:min(100%, 15rem); margin:0 auto; }
.clock .face{ fill:var(--surface); stroke:var(--ink); stroke-width:3; }
.clock .tick{ stroke:var(--muted); stroke-width:1; }
.clock .tick.major{ stroke:var(--ink); stroke-width:3; }
.clock .num{ fill:var(--ink); font-size:17px; font-weight:700; font-family:inherit; }
.clock .hand{ stroke:var(--ink); stroke-linecap:round; }
.clock .hour{ stroke-width:7; }
.clock .minute{ stroke-width:4; stroke:var(--anchor); }
.clock .pin{ fill:var(--ink); }

.ordered{ margin:0 0 1rem; padding:0 0 0 1.6rem; min-height:3rem; font-size:1.15rem; font-weight:700; }
.ordered li{ padding:0.35rem 0; }
.ordered:empty::before{ content:"Your steps will line up here."; font-weight:400; color:var(--muted); margin-left:-1.6rem; }
.pool{ display:grid; gap:0.7rem; max-width:36rem; }

.fb{
  position:sticky; bottom:0.6rem; margin-top:1.4rem; padding:1rem;
  background:var(--surface); border:3px solid var(--line); border-radius:0.8rem;
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.8rem 1.4rem;
}
.fb[hidden]{ display:none; }
.fb[data-kind="good"]{ border-color:var(--good); }
.fb[data-kind="part"]{ border-color:var(--mark); }
.fb[data-kind="bad"]{ border-color:var(--bad); }
.fb p{ margin:0.2rem 0 0; }
.fb > div{ flex:1 1 14rem; }

.results{ list-style:none; margin:1.2rem 0 0; padding:0; }
.results li{ display:grid; grid-template-columns:1fr auto; gap:0.1rem 1rem; padding:0.9rem 1rem; border-bottom:1px solid var(--line); }
.results .score{ font-weight:700; font-size:1.3rem; }
.results small{ grid-column:1 / -1; color:var(--muted); font-size:0.95rem; }
.mini{ display:block; width:9rem; height:2.2rem; }
.mini rect{ fill:var(--primary); }
.mini .base{ fill:var(--line); }
.side{ display:grid; grid-template-columns:5.5rem 1fr 3.2rem; align-items:center; gap:0.8rem; padding:0.6rem 1rem; }
.side div{ height:1.1rem; background:var(--cell); border-radius:0.55rem; overflow:hidden; }
.side i{ display:block; height:100%; background:var(--primary); }
.side b{ text-align:right; }

.switch{
  display:flex; align-items:center; justify-content:space-between; gap:1rem; width:100%;
  min-height:3.8rem; padding:0.8rem 1rem; text-align:left;
  background:transparent; border:0; border-bottom:1px solid var(--line);
}
.switch em{ font-style:normal; font-weight:700; min-width:2.2rem; text-align:right; }
.field{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.6rem 1rem; padding:0.8rem 1rem; border-bottom:1px solid var(--line); }
.field input{
  font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line);
  border-radius:0.6rem; padding:0.5rem 0.7rem; min-height:2.8rem; width:min(100%, 14rem);
}
.stepper{ display:flex; align-items:center; gap:0.6rem; }
.stepper button{ width:2.8rem; height:2.8rem; border-radius:50%; border:2px solid var(--primary); background:transparent; color:var(--primary); font-weight:700; font-size:1.3rem; line-height:1; }
.stepper span{ min-width:6.5rem; text-align:center; }
.note{ font-size:0.95rem; color:var(--muted); margin-top:1.6rem; }
/* iPad and larger */
@media (min-width:700px){
  #app{ max-width:74rem; }
  .pair{ gap:1.4rem 2.4rem; }
  .pair > div{ flex:0 1 20rem; max-width:20rem; }
  .grid.sq{ width:min(100%, 20rem); }
  .clock{ width:19rem; margin:0; }
  .board .node{ width:64px; height:64px; font-size:23px; }
  .bigword{ padding:2.2rem 1rem; }
  .opts.col{ max-width:44rem; }
  .pool{ max-width:44rem; }
}
.stovewrap{ max-width:22rem; margin:0.4rem 0 0; }
.stove{ display:block; width:100%; }
.stove .top{ fill:var(--surface); stroke:var(--ink); stroke-width:3; }
.stove .coil{ fill:none; stroke:var(--muted); stroke-width:4; }
.stove .coil.lit{ stroke:var(--anchor); }
.stove .glow{ fill:var(--anchor); opacity:0.18; }
.stove .pot{ fill:var(--ink); }
.stove .potlid{ fill:none; stroke:var(--surface); stroke-width:3; opacity:0.5; }
.stove .knob{ fill:var(--cell); stroke:var(--ink); stroke-width:2; }
.stove .knobmark{ stroke:var(--ink); stroke-width:4; stroke-linecap:round; }
.track{ position:relative; background:var(--surface); border:5px solid var(--line); border-radius:0.8rem; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.track[data-s="on"]{ border-color:var(--good); }
.track[data-s="off"]{ border-color:var(--bad); }
.tgt{ position:absolute; left:0; top:0; border-radius:50%; background:var(--primary); pointer-events:none; will-change:transform; }
.tgt::after{ content:""; position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:var(--surface); }
.track[data-s="on"] .tgt{ background:var(--good); box-shadow:0 0 0 12px rgba(91,208,142,0.35); }
.track[data-s="off"] .tgt{ box-shadow:0 0 0 7px var(--bad); }
.fdot{ position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:var(--mark); border:3px solid var(--ink); pointer-events:none; display:none; will-change:transform; }
.tlines{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.tline{ stroke:var(--bad); stroke-width:5; stroke-dasharray:10 8; stroke-linecap:round; }
.track-status{ font-size:1.25rem; min-height:1.6em; }
.photo{ position:relative; max-width:40rem; margin:1.2rem 0 0; border-radius:0.8rem; overflow:hidden; background:var(--cell); }
.photo.small{ max-width:24rem; margin-top:0.4rem; }
.photo img{ display:block; width:100%; height:auto; max-height:62vh; object-fit:contain; }
.cover{ position:absolute; inset:0; display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(3, 1fr); }
.cover i{ background:var(--primary); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.22); transition:opacity 0.7s ease, transform 0.7s ease; }
.cover i.gone{ opacity:0; transform:scale(0.85); }
@media (prefers-reduced-motion: reduce){ .cover i{ transition:none; } }
.caption{ font-size:1.25rem; font-weight:700; margin:0.6rem 0 0; max-width:40rem; }
.btnrow.starts{ margin-top:0.4rem; }
.btnrow.starts .btn.big{ margin-top:0; }
.group.pad{ padding:1rem; display:grid; gap:0.9rem; justify-items:start; }
.field.bare{ padding:0; border:0; width:100%; }
.seg{ display:flex; flex-wrap:wrap; gap:0.5rem; }
.seg button{ min-height:3rem; padding:0.4rem 1rem; border-radius:0.7rem; border:2px solid var(--line); background:var(--bg); font-weight:700; font-size:1rem; }
.seg button.on{ border-color:var(--primary); background:var(--primary); color:var(--on-primary); }
.joinrow{ display:flex; gap:0.7rem; align-items:center; }
.codein{ font:inherit; font-size:1.6rem; font-weight:700; letter-spacing:0.25em; text-transform:uppercase; width:8.5rem; min-height:3.3rem; padding:0.3rem 0.6rem; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:0.7rem; }
.mscores{ display:flex; flex-wrap:wrap; gap:0.7rem; margin:0.2rem 0 0.4rem; }
.chip{ display:flex; align-items:center; gap:0.8rem; padding:0.5rem 1rem; border-radius:999px; border:3px solid var(--line); background:var(--surface); font-weight:700; font-size:1.1rem; }
.chip b{ font-size:1.4rem; }
.chip.p0{ border-color:var(--primary); }
.chip.p1{ border-color:var(--mark); }
.chip.now{ box-shadow:0 0 0 4px var(--mark); }
.chip.p0.now{ background:var(--primary); color:var(--on-primary); }
.chip.p1.now{ background:var(--mark); color:var(--on-mark); }
.mstatus{ font-size:1.25rem; font-weight:700; min-height:1.6em; margin:0.4rem 0 0.8rem; max-width:none; }
.mboard{ display:grid; gap:10px; justify-content:start; }
.mcard{ position:relative; padding:0; border:0; background:transparent; perspective:900px; border-radius:12px; }
.mcard .inner{ position:absolute; inset:0; transition:transform 0.45s ease; transform-style:preserve-3d; -webkit-transform-style:preserve-3d; }
.mcard.up .inner{ transform:rotateY(180deg); }
.mcard .back, .mcard .front{ position:absolute; inset:0; border-radius:12px; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:grid; place-items:center; }
.mcard .back{ background:var(--primary); background-image:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18) 0 18%, transparent 19%), repeating-linear-gradient(45deg, rgba(255,255,255,0.07) 0 10px, transparent 10px 20px); }
.mcard .front{ transform:rotateY(180deg); background:var(--surface); border:3px solid var(--line); }
.mcard .front img{ width:100%; height:100%; object-fit:cover; display:block; }
.mcard .emo{ line-height:1; }
.mcard.got .front{ border-color:var(--good); }
.mcard.p0 .front{ border:6px solid var(--primary); }
.mcard.p1 .front{ border:6px solid var(--mark); }
.mcard[disabled]{ cursor:default; opacity:1; }
@media (prefers-reduced-motion: reduce){ .mcard .inner{ transition:none; } }
.waitbox{ grid-column:1 / -1; padding:1.5rem; background:var(--surface); border:1px solid var(--line); border-radius:0.8rem; max-width:34rem; }
.bigcode{ font-size:4rem; font-weight:700; letter-spacing:0.3em; margin:0.2rem 0; }
.bisect{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:0.8rem; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; cursor:crosshair; }
.bsvg{ display:block; }
.bline{ stroke:var(--ink); stroke-linecap:round; }
.bmid{ stroke:var(--good); stroke-width:5; stroke-linecap:round; }
.btap{ fill:var(--mark); stroke:var(--ink); stroke-width:3; }
.mpair{ align-items:center; }
.mpair > div{ flex:1 1 12rem; max-width:20rem; background:var(--surface); border:1px solid var(--line); border-radius:0.8rem; }
.mshape{ display:block; width:100%; height:auto; }
.mcell{ fill:var(--primary); }
.gauge{ padding:1.2rem 1rem 0.6rem; }
.gauge p{ margin:0.8rem 0 0.2rem; }
.gline{ position:relative; height:10px; background:var(--cell); border-radius:5px; margin:1rem 0.6rem 0; }
.gmid{ position:absolute; left:50%; top:-12px; bottom:-12px; width:4px; margin-left:-2px; background:var(--good); border-radius:2px; }
.gdot{ position:absolute; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:var(--mark); border:3px solid var(--ink); }
</style>
</head>
<body>
<div id="anchor" aria-hidden="true"></div>
<main id="app"></main>

let ac;
function tone(ok) {
  if (!S.settings.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.connect(g); g.connect(ac.destination); o.type = 'sine';
    o.frequency.setValueAtTime(ok ? 660 : 220, t);
    if (ok) o.frequency.setValueAtTime(880, t + 0.1);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.start(t); o.stop(t + 0.35);
  } catch (e) {}
}
document.addEventListener('pointerdown', () => {
  if (!S.settings.sound) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {}
}, { passive: true });
function blip(kind) {
  if (!S.settings.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    const f = { on: [660, 990], tick: [880, 880], off: [220, 165] }[kind];
    const vol = kind === 'tick' ? 0.05 : 0.12, dur = kind === 'tick' ? 0.08 : 0.24;
    o.type = kind === 'off' ? 'triangle' : 'sine';
    o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(f[0], t); o.frequency.linearRampToValueAtTime(f[1], t + dur * 0.6);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}

let run = null;
function fresh(bank) {
  run.used = run.used || new Set();
  let pool = bank.filter(x => !run.used.has(x));
  if (!pool.length) { bank.forEach(x => run.used.delete(x)); pool = bank; }

}

    h('p', { class: 'note', text: 'Scores are saved on this iPad only. Brain Gym is for practice at home and doesn’t replace therapy. Show it to your therapist so they can say which exercises and levels fit you best.' }),
    h('p', { class: 'note', text: 'Version 1.7, October 25, 2026' })
  );
}

/* ---------- family games: Photo Match ---------- */
const DECK = ['🐟', '🦌', '🚜', '🐻', '🍎', '⚓', '🏠', '🌲', '☕', '🐶', '🚗', '🎣', '🦆', '🌻'];
const P_COLORS = ['p0', 'p1'];
const API = 'api.php';
let G = null; // { st, v, room, seat, local, poll, busy, els }

async function api(method, body, query) {
  const r = await fetch(API + (query || ''), {
    method, cache: 'no-store',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 204) return { status: 204 };
  let j = null; try { j = await r.json(); } catch (e) {}
  return { status: r.status, j };
}
function newDeck(size, usePhotos) {
  const pairs = size / 2;
  let faces = [];
  if (usePhotos && PHOTOS.length) faces = shuffle(PHOTOS).slice(0, pairs).map(p => ({ t: 'p', f: p.file }));
  shuffle(DECK).slice(0, pairs - faces.length).forEach(e => faces.push({ t: 'e', e }));
  const cards = shuffle(faces.flatMap((f, k) => [{ k, ...f }, { k, ...f }]));
  return cards;
}
function freshMatch(opts, players) {
  return {
    game: 'match', mode: opts.mode, size: opts.size, photos: opts.photos,
    players, turn: 0, scores: [0, 0], tries: 0,
    cards: newDeck(opts.size, opts.photos), matched: Array(opts.size).fill(-1), up: [],
    phase: players[1] ? 'play' : 'wait', msg: '', seq: 0
  };
}
function saveRoom() { try { localStorage.setItem('braingym.room', JSON.stringify({ room: G.room, seat: G.seat, t: Date.now() })); } catch (e) {} }
function savedRoom() {
  try { const r = JSON.parse(localStorage.getItem('braingym.room') || 'null'); if (r && Date.now() - r.t < 6 * 3600e3) return r; } catch (e) {}
  return null;
}
function forgetRoom() { try { localStorage.removeItem('braingym.room'); } catch (e) {} }

async function commit(st) {
  st.seq = (st.seq || 0) + 1;
  if (G.local) { G.st = st; drawMatch(); return true; }
  G.st = st; drawMatch();
  try {
    const r = await api('POST', { room: G.room, base: G.v, state: st });
    if (r.status === 200 && r.j) { G.v = r.j.v; G.offline = false; return true; }
    if (r.status === 409 && r.j) { G.v = r.j.v; G.st = r.j.state; drawMatch(); return false; }
    throw new Error('bad status ' + r.status);
  } catch (e) { G.offline = true; drawMatch(); return false; }
}
function startPolling() {
  let failing = 0;
  const tick = async () => {
    if (!G || G.local) return;
    try {
      const r = await api('GET', null, `?room=${G.room}&since=${G.v}`);
      if (r.status === 200 && r.j && r.j.v > G.v) {
        G.v = r.j.v; const was = G.st; G.st = r.j.state;
        if (was && was.phase === 'wait' && G.st.phase === 'play') { tone(true); say && S.settings.voice && say(`${G.st.players[1].name} joined.`); }
        if (G.st.game === 'match' && G.screen !== 'match') showMatch(); else drawMatch();
      } else if (r.status === 404) { G.gone = true; drawMatch(); }
      failing = 0; if (G.offline) { G.offline = false; drawMatch(); }
    } catch (e) { if (++failing > 2 && !G.offline) { G.offline = true; drawMatch(); } }
  };
  const id = setInterval(tick, 1000);
  stops.push(() => clearInterval(id));
  tick();
}
const myTurn = () => G.local || G.st.turn === G.seat;
const pname = i => (G.st.players[i] && G.st.players[i].name) || `Player ${i + 1}`;

function flip(i) {
  const st = JSON.parse(JSON.stringify(G.st));
  if (st.phase !== 'play' || G.busy) return;
  if (st.matched[i] >= 0 || st.up.includes(i) || st.up.length >= 2) return;
  if (!myTurn()) { G.note = `It’s ${pname(st.turn)}’s turn.`; drawMatch(); return; }
  G.note = '';
  blip('tick');
  if (st.up.length === 0) { st.up = [i]; st.msg = ''; commit(st); return; }
  const a = st.up[0];
  st.up = [a, i]; st.tries++;
  if (st.cards[a].k === st.cards[i].k) {
    st.matched[a] = st.matched[i] = st.turn; st.up = []; st.scores[st.turn]++;
    const c = st.cards[i], cap = c.t === 'p' ? (photoInfo({ file: c.f }).caption || '') : '';
    st.msg = `match|${st.turn}|${cap}`;
    if (st.matched.every(m => m >= 0)) st.phase = 'done';
    commit(st);
  } else {
    st.msg = `miss|${st.turn}`;
    commit(st);
  }
}
function settleMiss() {
  const st = G.st;
  if (!st || st.phase !== 'play' || st.up.length !== 2) return;
  const key = st.seq;
  const mine = myTurn();
  later(() => {
    if (!G || G.st.seq !== key || G.st.up.length !== 2) return;
    const n = JSON.parse(JSON.stringify(G.st));
    n.up = []; n.turn = n.players[1] ? 1 - n.turn : 0; n.msg = `pass|${n.turn}`;
    commit(n);
  }, mine ? 1700 : 5000);
}

function showFamily() {
  clearTimers(); G = null;
  const saved = savedRoom();
  const hasPhotos = PHOTOS.length > 0;
  const opt = { mode: 'turns', size: 12, photos: hasPhotos };
  const seg = (key, items) => {
    const wrap = h('div', { class: 'seg', role: 'radiogroup' });
    const draw = () => wrap.replaceChildren(...items.map(([v, label]) => h('button', {
      type: 'button', role: 'radio', 'aria-checked': String(opt[key] === v), class: opt[key] === v ? 'on' : '', text: label,
      onclick: () => { opt[key] = v; draw(); }
    })));
    draw(); return wrap;
  };
  const me = h('input', { type: 'text', id: 'pn1', maxlength: '16', value: S.settings.name || '', autocomplete: 'off', placeholder: 'Your name' });
  const other = h('input', { type: 'text', id: 'pn2', maxlength: '16', value: '', autocomplete: 'off', placeholder: 'Other player' });
  const err = h('p', { class: 'cue', role: 'status' });
  const nm = (el, d) => (el.value || '').trim().slice(0, 16) || d;
  const playHere = () => {
    G = { local: true, st: freshMatch(opt, [{ name: nm(me, 'Player 1') }, { name: nm(other, 'Player 2') }]), seat: 0 };
    showMatch();
  };
  const host = async () => {
    err.textContent = 'Starting the game…';
    const st = freshMatch(opt, [{ name: nm(me, 'Player 1') }, null]);
    try {
      const r = await api('POST', { create: true, state: st });
      if (r.status !== 200 || !r.j || !r.j.room) throw 0;
      G = { local: false, st, v: r.j.v, room: r.j.room, seat: 0 };
      saveRoom(); showMatch(); startPolling();
    } catch (e) { err.textContent = 'Couldn’t start an online game. Check that this iPad is online, then try again.'; }
  };
  const code = h('input', { type: 'text', id: 'code', maxlength: '4', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', class: 'codein', placeholder: 'CODE' });
  code.addEventListener('input', () => { code.value = code.value.toUpperCase().replace(/[^A-Z]/g, ''); });
  const join = async (roomCode, seatHint) => {
    const room = (roomCode || code.value).toUpperCase();
    if (!/^[A-Z]{4}$/.test(room)) { err.textContent = 'Type the 4-letter code from the other player’s screen.'; return; }
    err.textContent = 'Joining…';
    try {
      const r = await api('GET', null, `?room=${room}`);
      if (r.status === 404) { err.textContent = `No game with the code ${room}. Check the letters and try again.`; return; }
      if (r.status !== 200 || !r.j) throw 0;
      G = { local: false, st: r.j.state, v: r.j.v, room, seat: seatHint != null ? seatHint : 1 };
      if (seatHint == null && G.st.phase === 'wait') {
        const n = JSON.parse(JSON.stringify(G.st));
        n.players[1] = { name: nm(me, 'Player 2') }; n.phase = 'play'; n.msg = `joined|1`;
        await commit(n);
      }
      saveRoom(); showMatch(); startPolling();
    } catch (e) { err.textContent = 'Couldn’t reach the game. Check that this iPad is online, then try again.'; }
  };
  screen(
    backBar('Photo Match'),
    h('p', { text: 'Flip two cards at a time and find the pairs. Play on this iPad, or online with someone far away while you’re on a FaceTime call.' }),
    saved ? h('div', { class: 'btnrow' }, h('button', { class: 'btn', type: 'button', text: `Rejoin game ${saved.room}`, onclick: () => join(saved.room, saved.seat) })) : null,
    h('h2', { class: 'area', text: 'Your name' }),
    h('div', { class: 'group' }, h('div', { class: 'field' }, h('label', { for: 'pn1', text: 'Name' }), me)),
    h('h2', { class: 'area', text: 'How to play' }),
    h('div', { class: 'group pad' },
      seg('mode', [['turns', 'Take turns and keep score'], ['team', 'Team up, beat your best']]),
      seg('size', [[8, '8 cards'], [12, '12 cards'], [16, '16 cards'], [20, '20 cards']]),
      hasPhotos ? seg('photos', [[true, 'Family photos'], [false, 'Pictures']]) : h('p', { class: 'muted', text: 'Add family photos to play with your own pictures.' })),
    h('h2', { class: 'area', text: 'Play on this iPad' }),
    h('div', { class: 'group pad' },
      h('div', { class: 'field bare' }, h('label', { for: 'pn2', text: 'Other player' }), other),
      h('button', { class: 'btn', type: 'button', text: 'Play here', onclick: playHere })),
    h('h2', { class: 'area', text: 'Play online' }),
    h('div', { class: 'group pad' },
      h('button', { class: 'btn', type: 'button', text: 'Start an online game', onclick: host }),
      h('p', { class: 'muted', text: 'Or join someone else’s game with their code:' }),
      h('div', { class: 'joinrow' }, code, h('button', { class: 'btn quiet', type: 'button', text: 'Join', onclick: () => join() }))),
    err
  );
}

function gridFor(n, W, H) {
  let full = null, any = null;
  for (let c = 2; c <= 10; c++) {
    const r = Math.ceil(n / c), s = Math.min((W - 10 * (c - 1)) / c, (H - 10 * (r - 1)) / r);
    if (r * c - n >= c) continue;
    if (!any || s > any.s) any = { c, r, s };
    if (n % c === 0 && (!full || s > full.s)) full = { c, r, s };
  }
  return full && full.s * 1.2 >= any.s ? full : any;
}
function showMatch() {
  clearTimers(); if (G && !G.local) startPolling();
  G.screen = 'match'; G.els = null;
  const status = h('p', { class: 'mstatus', role: 'status' });
  const board = h('div', { class: 'mboard' });
  const scores = h('div', { class: 'mscores' });
  const foot = h('div', { class: 'btnrow' });
  screen(
    h('header', { class: 'top' },
      h('button', { class: 'btn quiet small', type: 'button', text: 'Leave', onclick: () => { if (!G.local && G.st.phase === 'done') forgetRoom(); showHome(); } }),
      h('h2', { text: G.local ? 'Photo Match' : `Photo Match · code ${G.room}` }), h('span')),
    scores, status, board, foot);
  G.els = { status, board, scores, foot };
  drawMatch();
}
function drawMatch() {
  if (!G || !G.els || G.screen !== 'match') return;
  const { status, board, scores, foot } = G.els, st = G.st;
  if (st.phase === 'wait') {
    board.replaceChildren(h('div', { class: 'waitbox' },
      h('p', { text: 'Tell the other player this code:' }),
      h('p', { class: 'bigcode', text: G.room }),
      h('p', { class: 'muted', text: 'They open Brain Gym, tap Play with family, and type it under Play online. The game starts when they join.' })));
    scores.replaceChildren(); status.textContent = G.offline ? 'Can’t reach the game right now. Still trying…' : 'Waiting for the other player…';
    foot.replaceChildren();
    return;
  }
  const two = !!st.players[1];
  scores.replaceChildren(...[...st.players.map((p, i) => p ? h('div', { class: `chip ${P_COLORS[i]}${st.turn === i && st.phase === 'play' ? ' now' : ''}` },
    h('span', { text: p.name + (!G.local && i === G.seat ? ' (you)' : '') }),
    st.mode === 'turns' ? h('b', { text: String(st.scores[i]) }) : null) : null),
    st.mode === 'team' ? h('div', { class: 'chip team' }, h('span', { text: 'Tries' }), h('b', { text: String(st.tries) })) : null].filter(Boolean));
  // board
  if (!board.children.length || board.dataset.n !== String(st.cards.length) || board.dataset.deal !== st.cards.map(c => c.k).join('')) {
    const W = board.clientWidth || app.clientWidth || 700;
    const top = board.getBoundingClientRect().top || 220;
    const H = Math.max(260, (window.innerHeight || 800) - top - 40);
    const g = gridFor(st.cards.length, W, H);
    board.style.gridTemplateColumns = `repeat(${g.c}, ${Math.floor(g.s)}px)`;
    board.dataset.n = String(st.cards.length); board.dataset.deal = st.cards.map(c => c.k).join('');
    board.replaceChildren(...st.cards.map((c, i) => {
      const face = c.t === 'p'
        ? h('img', { src: 'photos/' + encodeURIComponent(c.f), alt: '', draggable: 'false' })
        : h('span', { class: 'emo', text: c.e, style: `font-size:${Math.floor(g.s * 0.55)}px` });
      return h('button', { class: 'mcard', type: 'button', 'aria-label': `Card ${i + 1}`, style: `width:${Math.floor(g.s)}px;height:${Math.floor(g.s)}px`, onclick: () => flip(i) },
        h('span', { class: 'inner' }, h('span', { class: 'back' }), h('span', { class: 'front' }, face), h('i', { class: 'owner' })));
    }));
  }
  [...board.children].forEach((el, i) => {
    const m = st.matched[i];
    el.classList.toggle('up', m >= 0 || st.up.includes(i));
    el.classList.toggle('got', m >= 0);
    el.classList.remove('p0', 'p1'); if (m >= 0 && st.mode === 'turns' && two) el.classList.add(P_COLORS[m]);
    el.disabled = m >= 0;
  });
  // status
  const [kind, who, cap] = (st.msg || '').split('|');
  const w = who != null && who !== '' ? pname(+who) : '';
  let line = '';
  if (st.phase === 'done') {
    const pairs = st.cards.length / 2;
    if (st.mode === 'team' || !two) {
      const key = 'm' + st.cards.length;
      S.matchBest = S.matchBest || {};
      const best = S.matchBest[key];
      if (G.doneSeq !== st.seq) { G.doneSeq = st.seq; G.newBest = !best || st.tries < best; if (G.newBest) { S.matchBest[key] = st.tries; save(); } tone(true); }
      line = `All ${pairs} pairs in ${st.tries} tries.` + (G.newBest ? ' That’s your best yet!' : ` Your best is ${best} tries.`);
    } else {
      const [a, b] = st.scores;
      line = a === b ? `It’s a tie, ${a} to ${b}!` : `${pname(a > b ? 0 : 1)} wins, ${Math.max(a, b)} to ${Math.min(a, b)}!`;
      if (G.doneSeq !== st.seq) { G.doneSeq = st.seq; tone(true); }
    }
    foot.replaceChildren(
      h('button', { class: 'btn big', type: 'button', text: 'Play again', onclick: () => {
        const n = freshMatch({ mode: st.mode, size: st.cards.length, photos: st.photos }, st.players);
        n.seq = st.seq; n.turn = two ? 1 - (st.firstTurn || 0) : 0; n.firstTurn = n.turn; commit(n);
      } }),
      h('button', { class: 'btn quiet', type: 'button', text: 'Leave', onclick: () => { forgetRoom(); showHome(); } }));
  } else {
    foot.replaceChildren();
    if (kind === 'match') line = `Match! ${cap ? cap + '. ' : ''}${w} goes again.`;
    else if (kind === 'miss') line = 'Not a match. Remember where those were.';
    else if (kind === 'pass' || kind === 'joined' || !kind) line = two ? (myTurn() && !G.local ? 'Your turn. Flip two cards.' : `${pname(st.turn)}’s turn. Flip two cards.`) : 'Flip two cards.';
    if (kind === 'match' && G.lastMatchSeq !== st.seq) { G.lastMatchSeq = st.seq; tone(true); }
    if (G.note) line = G.note;
  }
  if (G.offline) line = 'Can’t reach the game right now. Still trying…';
  if (G.gone) line = 'This game has ended. Leave and start a new one.';
  status.textContent = line;
  if (st.up.length === 2 && st.phase === 'play') settleMiss();
}
